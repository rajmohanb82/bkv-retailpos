# Dedicated Standalone High-Speed Retail POS Gateway (Port 89 -> External Port 8289)
server {
    listen 89;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 10M;

    location /api/admin/ {
        proxy_pass http://admin-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/pos/ {
        proxy_pass http://pos-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/stores/ {
        proxy_pass http://stores-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/analytics/ {
        proxy_pass http://analytics-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://annavya-frontend:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Port 8289;
        proxy_set_header X-POS-Standalone "true";
    }
}


