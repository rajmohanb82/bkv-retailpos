services:
  annavya-db:
    image: postgres:16-alpine
    container_name: annavya-db
    environment:
      POSTGRES_DB: annavya_erp
      POSTGRES_USER: annavya
      POSTGRES_PASSWORD: annavya_secret
    ports:
      - "5460:5432"
    volumes:
      - annavya_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annavya -d annavya_erp"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - annavya-net

  admin-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: admin-service
    container_name: annavya-admin-service
    environment:
      DATABASE_URL: postgresql://annavya:annavya_secret@annavya-db:5432/annavya_erp
    volumes:
      - ./services/admin-service/app:/app/app
    depends_on:
      annavya-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - annavya-net

  vendor-service:
